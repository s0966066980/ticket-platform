events { worker_connections 8192; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    log_format request_trace escape=json '{"service":"nginx","request_id":"$request_id","method":"$request_method","path":"$uri","status":"$status","duration_seconds":"$request_time","observed_at":"$time_iso8601"}';
    access_log /dev/stdout request_trace;
    access_log /var/log/ticket/access.jsonl request_trace;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream api { server backend:8000; keepalive 32; }
    upstream web { server frontend:80; keepalive 8; }
    server {
        listen 80;
        server_name _;
        # Request bodies include multipart overhead; application enforces the exact file limit.
        client_max_body_size 21m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        location = /health { proxy_pass http://api; proxy_set_header Host $host; }
        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
        location /ws/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 75s;
        }
        location = /docs { proxy_pass http://api; proxy_set_header Host $host; }
        location = /redoc { proxy_pass http://api; proxy_set_header Host $host; }
        location = /openapi.json { proxy_pass http://api; proxy_set_header Host $host; }
        location / { proxy_pass http://web; proxy_set_header Host $host; }
    }
}
