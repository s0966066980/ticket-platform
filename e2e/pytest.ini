[pytest]
testpaths = .
# pytest-asyncio (a backend test dependency sharing the venv) is irrelevant here
# and only emits loop-scope deprecation noise; the e2e suite is synchronous.
addopts = -ra --strict-markers -p no:asyncio
# Tests run one at a time in file order: the ticketing flow is a deliberately
# ordered sequence that builds on the activity created by its first test.
