name: PostgreSQL 16 and frontend verification

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticket-platform-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: PostgreSQL16 / Redis7 / Python3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ticket_test
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: ticket_test_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ticket_test -d ticket_test_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ticket_test:ci-local-only@127.0.0.1:5432/ticket_test_ci
      DATABASE_URL: postgresql+psycopg://ticket_test:ci-local-only@127.0.0.1:5432/ticket_test_ci
      REDIS_URL: redis://127.0.0.1:6379/15
      GATEWAY_SECRET: ci-only-gateway-signing-key
      UPLOAD_DIR: ${{ github.workspace }}/.runtime/uploads
      TELEMETRY_SPOOL_DIR: ${{ github.workspace }}/.runtime/telemetry
      PYTHONUNBUFFERED: '1'
    steps:
      # Official PG-service example uses checkout v6; versioned action manifests
      # for setup-python/setup-node v6 were checked before adding this workflow.
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Prepare evidence directory
        run: |
          mkdir -p artifacts/backend
          git rev-parse HEAD > artifacts/backend/commit.txt
          python --version > artifacts/backend/python.txt
          uname -a > artifacts/backend/runner.txt
      - name: Install backend and test dependencies
        run: |
          set -o pipefail
          python -m pip install -e './backend[test]' 2>&1 | tee artifacts/backend/install.log
          python -m pip freeze > artifacts/backend/dependencies.txt
      - name: Install native PG16 tools for startup CLI checks
        run: |
          set -o pipefail
          sudo apt-get update 2>&1 | tee artifacts/backend/apt-update.log
          sudo apt-get install -y --no-install-recommends postgresql-16 2>&1 | tee artifacts/backend/apt-postgresql.log
      - name: Verify real service versions and connectivity
        run: |
          set -o pipefail
          python scripts/ci_preflight.py 2>&1 | tee artifacts/backend/services.log
      - name: Run public CLI contracts
        run: |
          set -o pipefail
          python -m unittest discover -s scripts/tests -v 2>&1 | tee artifacts/backend/cli.log
          python -m unittest discover -s loadtests/tests -v 2>&1 | tee artifacts/backend/load-cli.log
          python scripts/ci_tests.py 2>&1 | tee artifacts/backend/evidence-gate.log
      - name: Apply migration to the disposable service database
        working-directory: backend
        run: |
          set -o pipefail
          python -m alembic upgrade head 2>&1 | tee ../artifacts/backend/migration.log
          python -m alembic current 2>&1 | tee ../artifacts/backend/migration-current.log
      - name: Run real PostgreSQL backend tests
        id: backend_tests
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest tests -ra --strict-markers --junitxml=../artifacts/backend/junit.xml 2>&1 | tee ../artifacts/backend/pytest.log
      - name: Require executed tests without skips
        if: ${{ always() && steps.backend_tests.outcome != 'skipped' }}
        run: python scripts/ci_assert_junit.py artifacts/backend/junit.xml
      - name: Preserve database and Redis failure logs
        if: ${{ failure() }}
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          mkdir -p artifacts/backend
          docker logs "$POSTGRES_CONTAINER" > artifacts/backend/postgres.log 2>&1 || true
          docker logs "$REDIS_CONTAINER" > artifacts/backend/redis.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: backend-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/backend/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Node24 frontend tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare evidence directory
        run: |
          mkdir -p artifacts/frontend
          git rev-parse HEAD > artifacts/frontend/commit.txt
          node --version > artifacts/frontend/node.txt
          npm --version > artifacts/frontend/npm.txt
      - name: Install frontend locked dependencies
        working-directory: frontend
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ../artifacts/frontend/install.log
      - name: Test frontend public behavior
        working-directory: frontend
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../artifacts/frontend/tests.log
      - name: Build production frontend
        working-directory: frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../artifacts/frontend/build.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: frontend-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/frontend/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: frontend-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
